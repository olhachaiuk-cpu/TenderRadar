name: Daily TED scan

on:
  schedule:
    - cron: '48 6 * * 1-5'
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run TenderRadar
        working-directory: TenderRadar.Cli
        env:
          ConnectionStrings__Postgres: ${{ secrets.POSTGRES_CONNECTION_STRING }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GoogleSheets__SpreadsheetId: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: dotnet run --no-build --configuration Release