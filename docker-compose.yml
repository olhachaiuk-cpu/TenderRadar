services:
  postgres:
    image: postgres:17-alpine
    container_name: tenderradar-db
    environment:
      POSTGRES_DB: tenderradar
      POSTGRES_USER: tenderradar
      POSTGRES_PASSWORD: devpass123
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderradar"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: